name: Harvest DWS peak flows

on:
  schedule:
    - cron: '17 3 * * 1'      # 03:17 UTC every Monday — light, weekly
  workflow_dispatch:            # allow manual runs from the Actions tab

permissions:
  contents: write               # needed to commit the harvested CSVs

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Harvest peak-flow CSVs
        run: python harvest_peaks.py

      - name: Commit updated data
        run: |
          git config user.name  "peaks-harvester[bot]"
          git config user.email "actions@github.com"
          git add data/peaks
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update DWS peak-flow data ($(date -u +%Y-%m-%d))"
            git push
          fi
